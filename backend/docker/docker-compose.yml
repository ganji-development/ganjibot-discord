  #     db:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: mysql://ganjibot:ganjibot@db:3306/ganjibot
  #   env_file:
  #     - ../.env
  #   ports:
  #     - "3000:3000"

volumes:
  db_data:
